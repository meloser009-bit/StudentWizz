<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Administration</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --primary: #1e293b;
            --primary-hover: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --warning: #d97706;
            --warning-hover: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card, .full-width-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
        }

        .full-width-card {
            margin-top: 20px;
            display: none; /* Hidden by default until toggled */
        }

        .full-width-card.active {
            display: block;
        }

        .card h3, .list-header h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: #fff;
            color: var(--text-main);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            background-color: var(--primary);
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-accent {
            background-color: var(--accent);
        }
        button.btn-accent:hover {
            background-color: var(--accent-hover);
        }

        button.btn-danger {
            background-color: var(--danger);
            width: auto;
            padding: 4px 10px;
            font-size: 0.8rem;
        }
        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        button.btn-warning {
            background-color: var(--warning);
            width: auto;
            padding: 4px 10px;
            font-size: 0.8rem;
            margin-right: 6px;
        }
        button.btn-warning:hover {
            background-color: var(--warning-hover);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-header h3 {
            margin-bottom: 0;
        }

        .list-actions {
            display: flex;
            gap: 10px;
        }

        .list-header button {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        li:last-child {
            border-bottom: none;
        }

        .student-info {
            flex-grow: 1;
        }

        .student-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .record-actions {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1 id="formTitle">Student Portal Administration</h1>
        <button onclick="toggleRecords()" style="width: auto; padding: 6px 14px; font-size: 0.85rem; background-color: var(--accent);">Toggle Records View</button>
    </header>

    <div class="grid">
        <!-- Register / Update Student Panel -->
        <div class="card">
            <h3 id="panelTitle">Register Student</h3>
            <input type="hidden" id="editStudentId">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="Department">
            </div>
            <button id="submitBtn" onclick="handleSubmit()">Submit Record</button>
            <button id="cancelBtn" onclick="resetForm()" style="display:none; background-color: var(--text-muted); margin-top: 6px;">Cancel Edit</button>
        </div>

        <!-- Course Enrollment Panel -->
        <div class="card">
            <h3>Course Enrollment</h3>
            <div class="form-group">
                <label for="studentSelect">Student Record</label>
                <select id="studentSelect">
                    <option value="">Select student...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="courseSelect">Course Designation</label>
                <select id="courseSelect">
                    <option value="CS101">CS101 - Computer Science 101</option>
                    <option value="MTH201">MTH201 - Advanced Mathematics</option>
                    <option value="ENG102">ENG102 - Electronics Engineering</option>
                    <option value="AI300">AI300 - Artificial Intelligence</option>
                </select>
            </div>
            <button class="btn-accent" onclick="enrollCourse()">Process Enrollment</button>
        </div>
    </div>

    <!-- Student Data Grid / List (Hidden by default) -->
    <div id="recordsContainer" class="full-width-card">
        <div class="list-header">
            <h3>System Records</h3>
            <div class="list-actions">
                <button onclick="loadStudents()">Refresh</button>
            </div>
        </div>
        <ul id="studentList">
            <li>Loading active records...</li>
        </ul>
    </div>
</div>

<script>
    const API_URL = '/api/students';

    function toggleRecords() {
        const container = document.getElementById('recordsContainer');
        container.classList.toggle('active');
        if (container.classList.contains('active')) {
            loadStudents();
        }
    }

    async function loadStudents() {
        try {
            const response = await fetch(API_URL);
            const students = await response.json();

            const listEl = document.getElementById('studentList');
            const selectEl = document.getElementById('studentSelect');

            listEl.innerHTML = '';
            selectEl.innerHTML = '<option value="">Select student...</option>';

            if (students.length === 0) {
                listEl.innerHTML = '<li style="color: var(--text-muted);">No records found.</li>';
                return;
            }

            students.forEach(student => {
                const li = document.createElement('li');
                const courses = student.enrolledCourses && student.enrolledCourses.length > 0
                    ? student.enrolledCourses.join(', ')
                    : 'None';

                // ID is hidden from user view here
                li.innerHTML = `
                    <div class="student-info">
                        <strong>${student.name}</strong> &mdash; ${student.department} (${student.email})
                        <div class="student-meta">Enrolled Courses: [${courses}]</div>
                    </div>
                    <div class="record-actions">
                        <button class="btn-warning" onclick="editStudent('${student.id}', '${student.name}', '${student.email}', '${student.department}')">Edit</button>
                        <button class="btn-danger" onclick="deleteStudent('${student.id}')">Delete</button>
                    </div>
                `;
                listEl.appendChild(li);

                // ID is hidden from dropdown text view here too
                const option = document.createElement('option');
                option.value = student.id;
                option.textContent = `${student.name} (${student.department})`;
                selectEl.appendChild(option);
            });
        } catch (error) {
            console.error("Error loading students:", error);
            document.getElementById('studentList').innerHTML = '<li style="color: var(--danger);">Connection error: Unable to reach backend server.</li>';
        }
    }

    function editStudent(id, name, email, department) {
        document.getElementById('editStudentId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('department').value = department;

        document.getElementById('panelTitle').textContent = 'Update Student Record';
        document.getElementById('submitBtn').textContent = 'Save Changes';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editStudentId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('department').value = '';

        document.getElementById('panelTitle').textContent = 'Register Student';
        document.getElementById('submitBtn').textContent = 'Submit Record';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    async function handleSubmit() {
        const id = document.getElementById('editStudentId').value;
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const department = document.getElementById('department').value.trim();

        if (!name || !email || !department) {
            alert("All fields are required.");
            return;
        }

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, department })
            });

            if (response.ok) {
                resetForm();
                if (document.getElementById('recordsContainer').classList.contains('active')) {
                    loadStudents();
                } else {
                    alert(id ? "Student updated successfully!" : "Student registered successfully!");
                }
            } else {
                alert("Operation failed.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student record?")) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadStudents();
            } else {
                alert("Failed to delete record.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function enrollCourse() {
        const studentId = document.getElementById('studentSelect').value;
        const courseId = document.getElementById('courseSelect').value;

        if (!studentId) {
            alert("Please select a student.");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${studentId}/courses?courseId=${courseId}`, {
                method: 'POST'
            });

            if (response.ok) {
                if (document.getElementById('recordsContainer').classList.contains('active')) {
                    loadStudents();
                } else {
                    alert(`Successfully enrolled in ${courseId}!`);
                }
            } else {
                alert("Enrollment failed.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>
</body>
</html>
